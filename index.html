<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>

    <style>
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Main Game Container */
        .game-container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        /* Header */
        header h1 {
            font-size: 2.3rem;
            color: #333;
            margin-bottom: 8px;
        }

        header p {
            color: #777;
            margin-bottom: 25px;
        }

        /* Player Information */
        .players {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .player {
            flex: 1;
            padding: 15px;
            border-radius: 0;
            background-color: #f4f5ff;
            border: 2px solid #e0e3ff;
        }

        .player h3 {
            color: #555;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .player-symbol {
            font-size: 2rem;
            font-weight: bold;
        }

        .player-x .player-symbol {
            color: #ff5c5c;
        }

        .player-o .player-symbol {
            color: #4b8bff;
        }

        .active-player {
            border: 2px solid #7c6df0;
            box-shadow: 0 5px 15px rgba(124, 109, 240, 0.2);
        }

        /* Game Status */
        .game-status {
            background-color: #e9f9ef;
            color: #23864b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Tic-Tac-Toe Grid */
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background-color: #f5f6ff;
            border: 2px solid #e2e5ff;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* X and O Colors */
        .cell.x {
            color: #ff5c5c;
        }

        .cell.o {
            color: #4b8bff;
        }

        /* Cell Hover Effect */
        .cell:hover {
            background-color: #e8eaff;
            transform: scale(1.04);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Winning Combination */
        .winning-cell {
            background-color: #d5f8df;
            border: 3px solid #0cecec;
            box-shadow: 0 5px 15px rgba(1, 13, 67, 0.25);
        }

        .winning-cell:hover {
            background-color: #c2f2d1;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 13px 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .new-game {
            background-color: #0b0535;
            color: rgba(255, 255, 255, 0.745);
        }

        .reset {
            background-color: #030b35;
            color: #f0e9e9e2;
            border: 1px solid #ddd;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.15);
        }

        .new-game:hover {
            background-color: #5b4be0;
        }

        .reset:hover {
            background-color: #e1e3ed;
        }

        /* Footer */
        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #999;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .game-container {
                padding: 20px;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .cell {
                font-size: 2.5rem;
                border-radius: 12px;
            }

            .players {
                gap: 10px;
            }

            button {
                font-size: 0.9rem;
                padding: 12px 8px;
            }
        }
    </style>
</head>

<body>

    <div class="game-container">

        <!-- Header -->
        <header>
            <h1> Tic-Tac-Toe</h1>
            <p>Challenge your friend!</p>
        </header>

        <!-- Player Information -->
        <section class="players">

            <div class="player player-x active-player">
                <h3>Player X</h3>
                <div class="player-symbol">X</div>
            </div>

            <div class="player player-o">
                <h3>Player O</h3>
                <div class="player-symbol">O</div>
            </div>

        </section>

        <!-- Game Status -->
        <div class="game-status">
            HURREY! Player X Wins!
        </div>

        <!-- Game Board -->
        <div class="game-board">

            <div class="cell x winning-cell">X</div>
            <div class="cell o">O</div>
            <div class="cell x">X</div>

            <div class="cell o">O</div>
            <div class="cell x winning-cell">X</div>
            <div class="cell o">O</div>

            <div class="cell x">X</div>
            <div class="cell o">O</div>
            <div class="cell x winning-cell">X</div>

        </div>

        <!-- Game Buttons -->
        <div class="buttons">
            <button class="new-game">New Game</button>
            <button class="reset">Reset</button>
        </div>

        <!-- Footer -->
        <footer>
            Made with LOVE using HTML & CSS
        </footer>

    </div>

</body>
</html>
